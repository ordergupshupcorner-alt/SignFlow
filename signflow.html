function businessHeader() {
  const b = db.settings.business;
  const addr = [b.address, b.city, [b.state, b.pincode].filter(Boolean).join(' - '), b.phone2 ? 'Ph: ' + b.phone2 : '']
    .filter(Boolean).join(', ');
  return `<div class="d-brand">
    ${b.logo ? `<img class="d-logo" src="${esc(b.logo)}" alt="">` : `<div class="d-ini">${esc(initials(b.name || 'SF'))}</div>`}
    <div>
      <div class="d-nm">${esc(b.name || 'YOUR BUSINESS NAME')}</div>
      ${b.tagline ? `<div class="d-tag">${esc(b.tagline)}</div>` : ''}
      <div class="d-addr">${esc(addr || 'Add your address in Business Settings')}
        ${b.phone ? `<br>Mob: ${esc(b.phone)}` : ''}${b.email ? ` · ${esc(b.email)}` : ''}
        ${b.gstin ? `<br><b>GSTIN: ${esc(b.gstin)}</b>` : ''}${b.website ? ` · ${esc(b.website)}` : ''}
      </div>
    </div>
  </div>`;
}

function docHTML(doc, kind) {
  const b = db.settings.business, bk = db.settings.bank;
  const c = getCustomer(doc.customerId) || {};
  const t = calcDoc(doc);
  const isJobCard = kind === 'jobcard' || doc.type === 'job';
  const isInv = doc.type === 'invoice' && !isJobCard;
  const isQuote = doc.type === 'quote';
  const title = isJobCard ? 'JOB CARD' : isQuote ? 'QUOTATION' : 'TAX INVOICE';
  const custAddr = [c.address, c.city, c.state, c.pincode].filter(Boolean).join(', ');
  const stamp = isInv
    ? (doc.status === 'cancelled' ? ['CANCELLED', '#b91c1c'] :
       t.balance <= 0.5 ? ['PAID', '#0b8f57'] : t.paid > 0 ? ['PART PAID', '#b54708'] : ['UNPAID', '#b91c1c'])
    : isQuote ? (doc.status === 'approved' ? ['APPROVED', '#0b8f57'] : doc.status === 'rejected' ? ['NOT CONFIRMED', '#b91c1c'] : null)
      : null;

  const sizeCell = l => {
    if (l.unit === 'sqft') return `<span class="big-size">${nf(l.w, 2)}″ × ${nf(l.h, 2)}″</span>`;
    if (l.unit === 'rft') return `<span class="big-size">${nf(l.h, 2)}″</span> run`;
    if (l.unit === 'pcs') return '—';
    return 'Lump sum';
  };
  const qtyCell = l => {
    if (l.unit === 'sqft') return `${nf(l.calc.grossQty)} sq.ft${l.calc.qty !== 1 ? `<div class="mut">${nf(l.calc.qty)} pc</div>` : ''}`;
    if (l.unit === 'rft') return `${nf(l.calc.grossQty)} r.ft${l.calc.qty !== 1 ? `<div class="mut">${nf(l.calc.qty)} pc</div>` : ''}`;
    if (l.unit === 'pcs') return `${nf(l.calc.qty)} pcs`;
    return '1 job';
  };

  const rows = t.lines.map((l, i) => `<tr>
    <td class="c">${i + 1}</td>
    <td><b>${esc(l.desc || '')}</b>${num(l.wastage) ? `<div class="mut">incl. ${nf(l.wastage, 1)}% wastage</div>` : ''}</td>
    ${isJobCard ? '' : `<td class="c">${esc(l.hsn || db.settings.tax.hsn || '')}</td>`}
    <td class="c">${isJobCard ? sizeCell(l) : sizeCell(l)}</td>
    <td class="r">${qtyCell(l)}</td>
    ${isJobCard ? '' : `<td class="r">${inr(l.rate)}<span class="mut">/${UNIT_LABEL[l.unit]}</span></td>`}
    <td class="r"><b>${inr(l.calc.amount)}</b></td></tr>`).join('');

  const head = `<tr>
    <th class="c" style="width:26px">#</th><th>Description</th>
    ${isJobCard ? '' : '<th class="c" style="width:58px">HSN</th>'}
    <th class="c" style="width:96px">Size</th>
    <th class="r" style="width:78px">Area / Qty</th>
    ${isJobCard ? '' : '<th class="r" style="width:66px">Rate</th>'}
    <th class="r" style="width:78px">Amount</th></tr>`;

  const totalsRows = `
    <tr><td>Subtotal</td><td class="r">${inr(t.subtotal)}</td></tr>
    ${t.disc > 0 ? `<tr><td>Discount${doc.discount.type === 'pct' ? ` (${nf(doc.discount.value, 2)}%)` : ''}</td><td class="r">− ${inr(t.disc)}</td></tr>` : ''}
    ${t.taxOn ? `
      <tr><td>Taxable value</td><td class="r">${inr(t.taxable)}</td></tr>
      ${t.mode === 'cgst'
        ? `<tr><td>CGST @ ${nf(t.rate / 2, 2)}%</td><td class="r">${inr(t.cgst)}</td></tr>
           <tr><td>SGST @ ${nf(t.rate / 2, 2)}%</td><td class="r">${inr(t.sgst)}</td></tr>`
        : `<tr><td>IGST @ ${nf(t.rate, 2)}%</td><td class="r">${inr(t.igst)}</td></tr>`}`
      : ''}
    ${t.roundOff ? `<tr><td>Round off</td><td class="r">${t.roundOff > 0 ? '+' : ''}${inr(t.roundOff)}</td></tr>` : ''}
    <tr class="grand"><td>${isQuote ? 'TOTAL' : 'TOTAL'}</td><td class="r">${inr(t.total)}</td></tr>
    ${isInv && t.paid > 0 ? `<tr><td>Received</td><td class="r">${inr(t.paid)}</td></tr>
      <tr class="bal"><td>Balance due</td><td class="r">${inr(t.balance)}</td></tr>` : ''}
    ${isQuote ? `<tr><td>Advance requested</td><td class="r">${inr(t.total * num(db.settings.defaults.advancePct) / 100)}</td></tr>` : ''}`;

  const bank = [bk.bankName, bk.accountNo && 'A/c ' + bk.accountNo, bk.ifsc && 'IFSC ' + bk.ifsc, bk.upi && 'UPI ' + bk.upi]
    .filter(Boolean).join(' · ');

  return `<div class="doc${t.lines.length > 8 ? ' compact' : ''}">
    <style>${DOC_CSS}</style>
    ${stamp ? `<div class="d-stamp" style="color:${stamp[1]};border-color:${stamp[1]}">${stamp[0]}</div>` : ''}
    <div class="d-top">
      ${businessHeader()}
      <div class="d-right">
        <div class="d-badge">${title}</div>
        <div class="d-no">${esc(doc.no || 'DRAFT')}</div>
        <div class="d-sub">Date: <b>${dmy(doc.date)}</b></div>
        ${isQuote ? `<div class="d-sub">Valid till: <b>${dmy(doc.dueDate)}</b></div>` : ''}
        ${isInv ? `<div class="d-sub">Due date: <b>${dmy(doc.dueDate)}</b></div>` : ''}
        ${isJobCard ? `<div class="d-sub">Delivery: <b>${dmy(doc.dueDate)}</b></div>` : ''}
        ${doc.ref ? `<div class="d-sub">Ref: ${esc(doc.ref)}</div>` : ''}
      </div>
    </div>

    <div class="d-panel">
      <div class="d-card" style="flex:1.35">
        <div class="k">${isJobCard ? 'Customer / site' : 'Bill to'}</div>
        <div class="v"><b>${esc(c.name || '—')}</b>
          ${custAddr ? `<br>${esc(custAddr)}` : ''}
          ${c.phone ? `<br>Mob: ${esc(c.phone)}${c.altPhone ? ' / ' + esc(c.altPhone) : ''}` : ''}
          ${c.gstin ? `<br>GSTIN: ${esc(c.gstin)}` : ''}
          ${c.email ? `<br>${esc(c.email)}` : ''}
        </div>
      </div>
      ${isJobCard ? `
        <div class="d-card">
          <div class="k">Work order</div>
          <div class="v"><b>Site:</b> ${esc(doc.site || c.address || '—')}<br>
            <b>Assigned:</b> ${esc(doc.assignee || '—')}<br>
            <b>Status:</b> ${esc(JOB_LABEL[doc.status] || doc.status)}</div>
        </div>` : `
        <div class="d-card">
          <div class="k">${isQuote ? 'Quotation details' : 'Invoice details'}</div>
          <div class="v">${isQuote ? `Validity: <b>${num(db.settings.defaults.validDays)} days</b><br>Prepared by: <b>${esc(b.owner || b.name || '—')}</b>`
            : `Place of supply: <b>${esc(c.state || b.state || '—')}</b><br>Reverse charge: <b>No</b>`}</div>
        </div>`}
    </div>

    <table class="dc-tbl">
      <thead>${head}</thead>
      <tbody>${rows || `<tr><td colspan="7" class="c mut">No items</td></tr>`}</tbody>
    </table>

    <div class="d-bottom">
      <div class="d-words">
        ${isJobCard
          ? `<div class="d-sec"><div class="h">Work notes / special instructions</div>${esc(doc.notes || '— no special instructions —')}
             <div class="mut" style="margin-top:5px">Order value: <b>${inr(t.total)}</b></div></div>`
          : `<div class="d-sec"><div class="h">Amount in words</div><b>${esc(amountInWords(t.total))}</b></div>`}
        ${isInv && bank ? `<div class="d-bank"><div class="h">Payment details</div>
          ${bk.accountName ? `A/c name: <b>${esc(bk.accountName)}</b><br>` : ''}
          <b>${esc(bank)}</b>${bk.branch ? `<br>Branch: ${esc(bk.branch)}` : ''}</div>` : ''}
        ${isQuote && bank ? `<div class="d-bank"><div class="h">Pay to</div><b>${esc(bank)}</b></div>` : ''}
        ${isJobCard ? `<div class="d-sec"><div class="h">Production checklist</div>
          <div class="chk">
            <span><i class="cbox"></i> Artwork approved</span><span><i class="cbox"></i> Material issued</span>
            <span><i class="cbox"></i> Printing done</span><span><i class="cbox"></i> Finishing / eyelets</span>
            <span><i class="cbox"></i> Frame / fitting</span><span><i class="cbox"></i> Installation done</span>
            <span><i class="cbox"></i> Site photo shared</span><span><i class="cbox"></i> Payment collected</span>
          </div></div>` : ''}
      </div>
      <div class="d-totals"><table class="dt">${totalsRows}</table></div>
    </div>

    ${doc.notes ? `<div class="d-sec"><div class="h">Note</div>${esc(doc.notes)}</div>` : ''}
    ${doc.terms ? `<div class="d-sec"><div class="h">Terms &amp; conditions</div><div class="d-terms">${esc(doc.terms)}</div></div>` : ''}

    ${isInv ? `<div class="d-sec" style="font-size:9.4px;color:#6b7280">Declaration: We declare that this invoice shows the actual price of the goods/services described and that all particulars are true and correct.</div>` : ''}
    <div class="d-sign">
      <div class="note">${isJobCard ? 'Production copy — please tick the checklist and return to office after installation.' :
        'This is a computer generated document. Goods once printed/installed are non-returnable. E. &amp; O.E.'}</div>
      ${isQuote ? `<div class="box">Customer acceptance<br><span class="mut">sign &amp; date</span></div>` : ''}
      <div class="box">For <b>${esc(b.name || '')}</b><br><span class="mut">Authorised signatory</span></div>
    </div>
    <div class="d-foot">${esc(b.name || '')}${b.phone ? ' · ' + esc(b.phone) : ''}${b.email ? ' · ' + esc(b.email) : ''}${b.website ? ' · ' + esc(b.website) : ''}</div>
  </div>`;
}

function receiptHTML(p) {
  const b = db.settings.business, bk = db.settings.bank;
  const d = getDoc(p.docId);
  const c = getCustomer(p.customerId) || {};
  const t = d ? calcDoc(d) : null;
  return `<div class="doc${t.lines.length > 8 ? ' compact' : ''}">
    <style>${DOC_CSS}</style>
    <div class="d-top">${businessHeader()}
      <div class="d-right"><div class="d-badge">PAYMENT RECEIPT</div>
        <div class="d-no">${esc('RCPT/' + String(p.date || '').replace(/-/g, '') + '/' + String(p.id).slice(-4).toUpperCase())}</div>
        <div class="d-sub">Date: <b>${dmy(p.date)}</b></div></div></div>
    <div class="d-panel">
      <div class="d-card"><div class="k">Received with thanks from</div>
        <div class="v"><b>${esc(c.name || '—')}</b>${c.phone ? `<br>Mob: ${esc(c.phone)}` : ''}${c.address ? `<br>${esc(c.address)}` : ''}</div></div>
      <div class="d-card"><div class="k">Against</div>
        <div class="v">${d ? `<b>${esc(d.no)}</b> (${d.type === 'invoice' ? 'Tax invoice' : d.type === 'job' ? 'Job card' : 'Quotation'})<br>Dated ${dmy(d.date)}` : '—'}</div></div>
    </div>
    <table class="dc-tbl"><thead><tr><th>Mode</th><th>Reference</th><th>Note</th><th class="r">Amount</th></tr></thead>
      <tbody><tr><td>${esc(p.mode)}</td><td>${esc(p.ref || '—')}</td><td>${esc(p.note || '—')}</td><td class="r"><b>${inr(p.amount)}</b></td></tr></tbody></table>
    <div class="d-bottom">
      <div class="d-words"><div class="d-sec"><div class="h">Amount in words</div><b>${esc(amountInWords(p.amount))}</b></div>
        ${t ? `<div class="d-sec"><div class="h">Account position</div>
          Document total: <b>${inr(t.total)}</b> · Received to date: <b>${inr(t.paid)}</b> · Balance: <b>${inr(t.balance)}</b></div>` : ''}
        ${bk.upi ? `<div class="d-bank"><div class="h">Pay online</div><b>UPI: ${esc(bk.upi)}</b></div>` : ''}
      </div>
      <div class="d-totals"><table class="dt">
        <tr><td>Amount received</td><td class="r">${inr(p.amount)}</td></tr>
        ${t ? `<tr class="bal"><td>Balance</td><td class="r">${inr(t.balance)}</td></tr>` : ''}
      </table></div>
    </div>
    <div class="d-sign"><div class="note">Thank you for your business.</div>
      <div class="box">For <b>${esc(b.name || '')}</b><br><span class="mut">Authorised signatory</span></div></div>
  </div>`;
}

function openPreview(html, title) {
  openModal({
    title: title || 'Document preview',
    size: 'xl',

/* ============================== WHATSAPP & SHARING ============================== */
function waNumber(phone) {
  let digits = String(phone || '').replace(/\D/g, '');
  const cc = String(db.settings.defaults.countryCode || '91');
  if (digits.startsWith('0')) digits = cc + digits.replace(/^0+/, '');
  else if (digits.length === 10) digits = cc + digits;
  return digits;
}

function waText(doc) {
  const b = db.settings.business, bk = db.settings.bank;
  const c = getCustomer(doc.customerId) || {};
  const t = calcDoc(doc);
  const isQuote = doc.type === 'quote', isInv = doc.type === 'invoice';
  const L = [];
  L.push(`*${isQuote ? 'QUOTATION' : isInv ? 'INVOICE' : 'JOB CARD'} ${doc.no}*`);
  L.push(`${b.name || ''}${b.phone ? ' · ' + b.phone : ''}`);
  L.push(`Date: ${dmy(doc.date)}`);
  L.push('');
  L.push(`Dear ${c.name || 'Customer'},`);
  L.push(isQuote ? 'Thank you for your enquiry. Please find our quotation below:'
    : isInv ? 'Please find your invoice details below:' : 'Your work order is confirmed. Details below:');
  L.push('');
  t.lines.forEach((l, i) => {
    const size = l.unit === 'sqft' ? ` — ${nf(l.w, 2)}"×${nf(l.h, 2)}"`
      : l.unit === 'rft' ? ` — ${nf(l.h, 2)}" run` : '';
    const q = l.unit === 'sqft' ? `${nf(l.calc.grossQty)} sq.ft` : l.unit === 'rft' ? `${nf(l.calc.grossQty)} r.ft`
      : l.unit === 'pcs' ? `${nf(l.calc.qty)} pcs` : 'lump sum';
    L.push(`${i + 1}. ${l.desc}${size} × ${q} @ ₹${nf(l.rate)} = *${inr(l.calc.amount)}*`);
  });
  L.push('');
  if (t.disc > 0) L.push(`Subtotal: ${inr(t.subtotal)}  |  Discount: −${inr(t.disc)}`);
  if (t.taxOn) L.push(`GST @ ${nf(t.rate, 2)}%: ${inr(t.taxAmount)}`);
  L.push(`*Total: ${inr(t.total)}*`);
  if (isInv) {
    if (t.paid > 0) L.push(`Received: ${inr(t.paid)}`);
    if (t.balance > 0.5) L.push(`*Balance due: ${inr(t.balance)}*${doc.dueDate ? ' (due ' + dmy(doc.dueDate) + ')' : ''}`);
    else L.push('*Fully paid — thank you!*');
  }
  if (isQuote && doc.dueDate) L.push(`Quotation valid till: ${dmy(doc.dueDate)}`);
  const pay = [bk.upi && 'UPI: ' + bk.upi, bk.accountNo && 'A/c: ' + bk.accountNo, bk.ifsc && 'IFSC: ' + bk.ifsc].filter(Boolean);
  if (pay.length && !(isInv && t.balance <= 0.5)) { L.push(''); L.push('*Payment:* ' + pay.join(' · ')); }
  L.push('');
  L.push('Reply here for any change in size, material or quantity.');
  L.push(`— ${b.owner || b.name || ''}`);
  return L.join('\n');
}

function copyText(text) {
  const done = () => toast('Copied to clipboard', 'ok');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  openModal({
    title: 'Copy message', size: 'lg',
    body: `<div class="field"><label>Message — select all and copy (Ctrl/Cmd + C)</label>
      <textarea class="input" rows="14" id="copyBox" onclick="this.select()">${esc(text)}</textarea></div>`,
    footer: `<button class="btn" data-act="closeModal">Close</button>
      <button class="btn btn-primary" data-act="copyBoxBtn">Copy</button>`,
    onOpen: () => { const box = $('#copyBox'); if (box) { box.focus(); box.select(); } }
  });
}

function openWhatsApp(doc) {
  const c = getCustomer(doc.customerId) || {};
  const text = waText(doc);
  const phone = waNumber(c.phone);
  if (!phone) {
    copyText(text);
    toast('Customer has no phone number — message copied instead', 'warn');
    return;
  }
  const url = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
  window.open(url, '_blank', 'noopener');
}

let MODAL = null;
function openModal(opts) {

      <div class="modal-h"><h3>${esc(opts.title || '')}</h3>
        <button class="icon-btn" data-act="closeModal" aria-label="Close">✕</button></div>
      <div class="modal-b">${opts.body || ''}</div>
      ${opts.footer ? `<div class="modal-f">${opts.footer}</div>` : ''}

}

  const root = $('#modalRoot');

  MODAL = null;
}
const mval = name => { const el = $(`#modalRoot [data-mf="${name}"]`); return el ? (el.type === 'checkbox' ? el.checked : el.value) : ''; };

/* ============================== ACTIONS ============================== */
function setStatus(id, value) {
  const d = getDoc(id);
  if (!d) return;
  d.status = value;
  d.updatedAt = new Date().toISOString();
  d.history = (d.history || []).concat([{ at: d.updatedAt, text: 'Status → ' + (JOB_LABEL[value] || value), status: value }]);
  save(true); render();
  toast('Status updated', 'ok');
}

function convertDoc(id, toType) {
  const src = getDoc(id);
  if (!src) return;
  const nd = newDoc(toType, {
    customerId: src.customerId,
    items: clone(src.items || []).map(i => Object.assign({}, i, { id: uid('li') })),
    discount: clone(src.discount || { type: 'pct', value: 0 }),
    tax: clone(src.tax || { mode: 'auto', rate: 18, inclusive: false }),
    notes: src.notes || '',
    sourceId: src.id,
    site: src.site || (getCustomer(src.customerId) || {}).address || '',
    assignee: src.assignee || ''
  });
  nd.id = uid('dc');
  nd.date = todayISO();
  nd.dueDate = addDays(todayISO(), toType === 'job' ? 5 : 7);
  nd.status = toType === 'job' ? 'new' : 'open';
  nd.terms = toType === 'invoice' ? db.settings.terms.invoice : '';
  assignNo(nd);
  nd.history = [{ at: new Date().toISOString(), text: `Created from ${src.type} ${src.no}`, status: nd.status }];
  db.docs.push(nd);
  src.convertedTo = nd.id;
  if (src.type === 'quote' && src.status !== 'approved') {
    src.status = 'approved';
    src.history = (src.history || []).concat([{ at: new Date().toISOString(), text: 'Approved → converted to ' + toType, status: 'approved' }]);
  }
  db.payments.forEach(p => { if (p.docId === src.id) { p.docId = nd.id; p.customerId = nd.customerId; } });
  save(true);
  goto({ view: 'doc', id: nd.id });
  toast(`${toType === 'job' ? 'Job card' : 'Invoice'} ${nd.no} created`, 'ok');
}

function deleteDoc(id) {
  const d = getDoc(id);
  if (!d) return;
  const linked = db.payments.filter(p => p.docId === id).length;
  confirmModal('Delete ' + (d.no || 'document') + '?',
    `This removes the ${d.type}${linked ? ` and its <b>${linked} payment record${linked > 1 ? 's' : ''}</b>` : ''}. This cannot be undone.`,
    () => {
      db.docs = db.docs.filter(x => x.id !== id);
      db.payments = db.payments.filter(p => p.docId !== id);
      db.docs.forEach(x => { if (x.sourceId === id) x.sourceId = null; if (x.convertedTo === id) x.convertedTo = null; });
      save(true);
      closeModal();
      goto({ view: 'list', type: d.type });
      toast('Deleted', 'ok');
    });
}

const ACTIONS = {
  /* navigation */
  nav: (id, el) => goto({ view: el.dataset.view, type: el.dataset.type || null }),
  printAll: () => window.print(),
  go: (id, el) => goto({ view: el.dataset.view }),
  openDoc: id => goto({ view: 'doc', id }),
  openCustomer: id => goto({ view: 'customer', id }),
  goBack: () => {
    const r = STATE.route;
    if (r.view === 'customer') goto({ view: 'list', type: 'customer' });
    else if (r.view === 'doc') { const d = getDoc(r.id); goto({ view: 'list', type: d ? d.type : 'quote' }); }
    else if (r.view === 'edit' || r.view === 'settings' || r.view === 'backup') goto({ view: 'dashboard' });
    else goto({ view: 'dashboard' });
  },
  setFilter: (id, el) => { STATE.listFilter[el.dataset.type] = el.dataset.v || ''; render(); },

  /* documents */
  new: (id, el) => startDoc(el.dataset.type, null, el.dataset.cust || null),
  editDoc: id => { const d = getDoc(id); if (d) startDoc(d.type, d.id); },
  saveDoc: () => saveDoc(),
  cancelEdit: () => {
    const d = STATE.draft;
    if (d && d.id) goto({ view: 'doc', id: d.id });
    else goto({ view: 'dashboard' });
  },
  addRow: () => {
    STATE.draft.items.push(blankItem());
    render();
    const rows = $$('.item-row');
    const last = rows[rows.length - 1];
    if (last) { const inp = $('[data-f="desc"]', last); if (inp) inp.focus(); }
  },
  delRow: (id, el) => {
    const idx = +el.dataset.idx;
    STATE.draft.items.splice(idx, 1);
    if (!STATE.draft.items.length) STATE.draft.items.push(blankItem());
    render();
  },
  setStatus: (id, el) => setStatus(id, el.dataset.v),
  convert: (id, el) => {
    const to = el.dataset.to;
    const src = getDoc(id);
    const label = to === 'job' ? 'job card' : 'invoice';
    confirmModal('Create ' + label + '?',
      `A new ${label} will be created from <b>${esc(src.no)}</b> with the same items, tax and discount. Payments already recorded will move to the new document. You can still edit it afterwards.`,
      () => { closeModal(); convertDoc(id, to); }, 'Create ' + label);
  },
  duplicate: id => {
    const src = getDoc(id);
    if (!src) return;
    const d = newDoc(src.type, {
      customerId: src.customerId,
      items: clone(src.items || []).map(i => Object.assign({}, i, { id: uid('li') })),
      discount: clone(src.discount || { type: 'pct', value: 0 }),
      tax: clone(src.tax || { type: 'auto', rate: 18, inclusive: false }),
      notes: src.notes, site: src.site, assignee: src.assignee
    });
    STATE.draft = d;
    goto({ view: 'edit', id: null, type: src.type });
    toast('Copy created — save to assign a new number', 'ok');
  },
  delDoc: id => deleteDoc(id),

  /* printing & sharing */
  printDoc: (id, el) => printDocument(id, (el && el.dataset.kind) || ''),
  printReceipt: id => {
    const p = db.payments.find(x => x.id === id);
    if (p) openPreview(receiptHTML(p), 'Payment receipt');
  },
  doPrint: () => doPrint(),
  waDoc: id => { const d = getDoc(id); if (d) openWhatsApp(d); },
  copySummary: id => { const d = getDoc(id); if (d) copyText(waText(d)); },
  copyBoxBtn: () => { const b = $('#copyBox'); if (b) { b.select(); document.execCommand && document.execCommand('copy'); copyText(b.value); } },
  call: id => { const c = getCustomer(id); if (c && c.phone) window.location.href = 'tel:' + c.phone.replace(/\s/g, ''); },

  /* payments */
  payModal: id => paymentModal(id || ''),
  savePayment: () => {
    const docId = mval('docId');
    const amount = round2(num(mval('amount')));
    const d = getDoc(docId);
    if (!d) { toast('Select the document this payment is against', 'err'); return; }
    if (!(amount > 0)) { toast('Enter an amount greater than zero', 'err'); return; }
    const p = {
      id: uid('pm'), docId, customerId: d.customerId, date: mval('date') || todayISO(),
      amount, mode: mval('mode') || 'Cash', ref: mval('ref') || '', note: mval('note') || ''
    };
    db.payments.push(p);
    d.updatedAt = new Date().toISOString();
    d.history = (d.history || []).concat([{ at: d.updatedAt, text: `Payment ${inr(amount)} received (${p.mode})`, status: d.status }]);
    save(true); closeModal(); render();
    toast('Payment of ' + inr(amount) + ' recorded', 'ok');
  },
  delPayment: id => {
    const p = db.payments.find(x => x.id === id);
    if (!p) return;
    confirmModal('Delete payment?', `Remove the ${inr(p.amount)} receipt dated ${dmy(p.date)}? The document balance will go back up.`, () => {
      db.payments = db.payments.filter(x => x.id !== id);
      save(true); closeModal(); render(); toast('Payment removed', 'ok');
    }, 'Remove');
  },

  /* customers */
  custModal: (id, el) => customerModal(id || '', el && el.dataset.pick === '1'),
  saveCustomer: (id, el) => {
    const name = String(mval('name') || '').trim();
    if (!name) { toast('Customer name is required', 'err'); return; }
    const data = {
      name, phone: String(mval('phone') || '').trim(), altPhone: mval('altPhone'), email: mval('email'),
      address: mval('address'), city: mval('city'), state: mval('state'), pincode: mval('pincode'),
      gstin: mval('gstin'), notes: mval('notes')
    };
    let cust;
    if (id) { cust = getCustomer(id); Object.assign(cust, data); }
    else { cust = Object.assign({ id: uid('cu'), createdAt: todayISO() }, data); db.customers.push(cust); }
    save(true);
    const draft = STATE.draft;
    closeModal();
    if (draft && (el.dataset.pick === '1' || !draft.customerId)) {
      draft.customerId = cust.id;
      if (STATE.route.view !== 'edit') startDoc(draft.type, draft.id);
      else render();
    } else render();
    toast('Customer saved', 'ok');
  },
  delCustomer: id => {
    const c = getCustomer(id);
    const n = docsForCustomer(id).length;
    confirmModal('Delete customer?', `<b>${esc(c.name)}</b> will be removed${n ? ` along with their <b>${n} document${n > 1 ? 's' : ''}</b>` : ''}. This cannot be undone.`, () => {
      db.customers = db.customers.filter(x => x.id !== id);
      const ids = db.docs.filter(d => d.customerId === id).map(d => d.id);
      db.docs = db.docs.filter(d => d.customerId !== id);
      db.payments = db.payments.filter(p => !ids.includes(p.docId) && p.customerId !== id);
      save(true); closeModal(); goto({ view: 'list', type: 'customer' }); toast('Customer deleted', 'ok');
    });
  },

  /* rates */
  itemModal: id => itemModal(id || ''),
  saveItem: id => {
    const name = String(mval('name') || '').trim();
    if (!name) { toast('Item name is required', 'err'); return; }
    const data = { name, category: mval('category'), unit: mval('unit'), rate: num(mval('rate')), hsn: mval('hsn') };
    if (id) Object.assign(getItem(id), data);
    else db.items.push(Object.assign({ id: uid('it') }, data));
    save(true); closeModal(); render(); toast('Rate saved', 'ok');
  },
  delItem: id => {
    confirmModal('Delete rate?', 'This only removes the saved rate — documents already created are not affected.', () => {
      db.items = db.items.filter(x => x.id !== id);
      save(true); closeModal(); render(); toast('Rate deleted', 'ok');
    });
  },
  seedItems: () => {
    const existing = new Set(db.items.map(i => i.name.toLowerCase()));
    seedItems().forEach(i => { if (!existing.has(i.name.toLowerCase())) db.items.push(i); });
    save(true); render(); toast('Standard rates added', 'ok');
  },

  /* settings & data */
  saveSettings: () => saveSettings(),
  clearLogo: () => { db.settings.business.logo = ''; save(true); render(); toast('Logo removed'); },
  exportJSON: () => {
    const name = 'signflow-backup-' + todayISO() + '.json';
    download(name, JSON.stringify(db, null, 2), 'application/json');
    toast('Backup downloaded', 'ok');
  },
  exportCSV: (id, el) => exportCSV(el.dataset.kind),
  loadDemo: () => {
    const go = () => { db = demoDB(); save(true); goto({ view: 'dashboard' }); toast('Sample business loaded', 'ok'); };
    if (db.docs.length || db.customers.length) confirmModal('Load sample data?', 'Your current customers, documents and payments will be replaced. Export a backup first if needed.', go, 'Replace data');
    else go();
  },
  wipe: () => confirmModal('Erase all data?', 'Every customer, document, rate and payment stored in this browser will be deleted permanently.', () => {
    db = defaultDB(); db.items = seedItems(); save(true); closeModal(); goto({ view: 'dashboard' }); toast('All data erased', 'ok');
  }, 'Erase everything'),
  confirmYes: () => { if (MODAL && MODAL.onYes) { const f = MODAL.onYes; f(); } },
  closeModal: () => closeModal(),
  toggleMenu: () => $('#sidebar').classList.toggle('open')
};

/* ============================== CSV / FILES ============================== */
function csvCell(v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }
function download(name, content, mime) {
  try {
    const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) { toast('Download blocked in this preview — open the file in a browser', 'err'); }
}

function exportCSV(kind) {
  const b = db.settings.business;
  let rows = [], name = '';
  if (kind === 'invoice') {
    name = 'invoices-' + todayISO() + '.csv';
    rows.push(['Invoice no', 'Date', 'Due date', 'Customer', 'Phone', 'GSTIN', 'State', 'Taxable', 'GST', 'Total', 'Received', 'Balance', 'Status']);
    docsOf('invoice').sort((x, y) => (x.date || '').localeCompare(y.date || '')).forEach(d => {
      const t = calcDoc(d), c = getCustomer(d.customerId) || {};
      rows.push([d.no, dmy(d.date), dmy(d.dueDate), c.name, c.phone, c.gstin, c.state, t.taxable, t.taxAmount, t.total, t.paid, t.balance, statusText(d)]);
    });
  } else if (kind === 'job') {
    name = 'jobs-' + todayISO() + '.csv';
    rows.push(['Job no', 'Date', 'Customer', 'Work', 'Site', 'Due', 'Assigned', 'Status', 'Value', 'Invoice no']);
    docsOf('job').sort((x, y) => (x.date || '').localeCompare(y.date || '')).forEach(d => {
      const inv = d.convertedTo ? getDoc(d.convertedTo) : null;
      rows.push([d.no, dmy(d.date), custName(d.customerId), jobTitle(d), d.site || '', dmy(d.dueDate), d.assignee || '', JOB_LABEL[d.status] || d.status, calcDoc(d).total, inv ? inv.no : '']);
    });
  } else if (kind === 'customer') {
    name = 'customers-' + todayISO() + '.csv';
    rows.push(['Customer', 'Phone', 'Alt phone', 'Email', 'Address', 'City', 'State', 'PIN', 'GSTIN', 'Billed', 'Outstanding']);
    db.customers.forEach(c => {
      const inv = docsForCustomer(c.id).filter(d => d.type === 'invoice' && d.status !== 'cancelled');
      rows.push([c.name, c.phone, c.altPhone, c.email, c.address, c.city, c.state, c.pincode, c.gstin,
        round2(inv.reduce((s, d) => s + calcDoc(d).total, 0)), round2(inv.reduce((s, d) => s + Math.max(0, calcDoc(d).balance), 0))]);
    });
  } else {
    name = 'payments-' + todayISO() + '.csv';
    rows.push(['Date', 'Customer', 'Against', 'Mode', 'Reference', 'Note', 'Amount']);
    db.payments.slice().sort((x, y) => (x.date || '').localeCompare(y.date || '')).forEach(p => {
      const d = getDoc(p.docId);
      rows.push([dmy(p.date), custName(p.customerId), d ? d.no : '', p.mode, p.ref, p.note, p.amount]);
    });
  }
  const csv = '\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  download(name, csv, 'text/csv;charset=utf-8');
  toast('CSV exported: ' + name, 'ok');
}

function importJSON(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(String(r.result));
      if (!data || !data.settings || !Array.isArray(data.docs)) throw new Error('bad');
      confirmModal('Import backup?', `Replace current data with this backup — <b>${(data.docs || []).length} documents, ${(data.customers || []).length} customers, ${(data.payments || []).length} payments</b>?<br><br>Current data will be overwritten.`, () => {
        db = migrate(data);
        save(true); closeModal(); goto({ view: 'dashboard' }); toast('Backup imported', 'ok');
      }, 'Import');
    } catch (e) { toast('That file is not a valid SignFlow backup', 'err'); }
  };
  r.readAsText(file);
}

/* ============================== EVENTS ============================== */
function applyRowFilter() {
  const q = (($('#q') || {}).value || '').trim().toLowerCase();
  $$('#listTbl tbody tr').forEach(tr => {
    const s = (tr.dataset.search != null ? tr.dataset.search : tr.textContent).toLowerCase();
    tr.style.display = (!q || s.includes(q)) ? '' : 'none';
  });
}

function wireEvents() {
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const fn = ACTIONS[t.dataset.act];
    if (!fn) return;
    e.preventDefault();
    fn(t.dataset.id, t, e);
  });

  document.addEventListener('input', e => {
    const el = e.target;
    if (el.id === 'q') { applyRowFilter(); return; }
    const d = STATE.draft;
    if (!d) return;
    const row = el.closest('.item-row');
    if (row && el.dataset.f) {
      const idx = +row.dataset.idx;
      const it = d.items[idx];
      if (it) { it[el.dataset.f] = el.value; refreshRow(row, it); updateTotals(); }
      return;
    }
    if (el.dataset.act2 === 'docField' && el.dataset.f) { d[el.dataset.f] = el.value; return; }
    if (el.dataset.act2 === 'jobField') { const doc = getDoc(el.dataset.id); if (doc) { doc[el.dataset.f] = el.value; save(true); } return; }
    if (el.dataset.act2 === 'discField') { d.discount[el.dataset.f] = el.value; updateTotals(); return; }
  });

  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.file === 'logo') {
      const f = el.files && el.files[0];
      if (!f) return;
      if (f.size > 900 * 1024) { toast('Please use an image under 900 KB', 'err'); return; }
      const r = new FileReader();
      r.onload = () => { db.settings.business.logo = String(r.result); save(true); render(); toast('Logo added', 'ok'); };
      r.readAsDataURL(f);
      return;
    }
    if (el.dataset.file === 'import') { importJSON(el.files && el.files[0]); el.value = ''; return; }

    const d = STATE.draft;
    if (!d) return;
    if (el.dataset.act2 === 'pickCustomer') { d.customerId = el.value; render(); return; }
    if (el.dataset.act2 === 'jobField') { const doc = getDoc(el.dataset.id); if (doc) { doc[el.dataset.f] = el.value; save(true); } return; }
    if (el.dataset.act2 === 'docField' && el.dataset.f) { d[el.dataset.f] = el.value; return; }
    if (el.dataset.act2 === 'discField') { d.discount[el.dataset.f] = el.value; updateTotals(); return; }
    if (el.dataset.act2 === 'taxField') {
      const f = el.dataset.f;
      if (f === 'inclusive') d.tax.inclusive = el.checked;
      else if (f === 'rate') d.tax.rate = num(el.value);
      else d.tax.mode = el.value;
      updateTotals(); return;
    }
    if (el.dataset.act2 === 'quickAdd' && el.value) {
      const item = getItem(el.value);
      if (item) {
        const blank = d.items.findIndex(i => !String(i.desc || '').trim() && !num(i.rate));
        const row = blankItem({ desc: item.name, itemId: item.id, unit: item.unit, rate: item.rate, hsn: item.hsn });
        if (blank > -1) d.items[blank] = row; else d.items.push(row);
        render(); toast(item.name + ' added', 'ok');
      }
      el.value = '';
      return;
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && $('#modalRoot').classList.contains('on')) { closeModal(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      if (STATE.route.view === 'edit') saveDoc();
      else if (STATE.route.view === 'settings') saveSettings();
      else save(true);
    }
  });

  const mb = $('#menuBtn');
  if (mb) mb.addEventListener('click', () => $('#sidebar').classList.toggle('open'));
  // tap outside the mobile drawer to close it
  document.addEventListener('click', e => {
    const sb = $('#sidebar');
    if (sb && sb.classList.contains('open') && !e.target.closest('#sidebar') && !e.target.closest('#menuBtn')) {
      sb.classList.remove('open');
    }
  }, true);

  window.addEventListener('online', () => { renderNav(); toast('Back online', 'ok'); });
  window.addEventListener('offline', () => { renderNav(); toast('Offline — everything still works', 'ok'); });
  window.addEventListener('beforeunload', () => { save(true); });
}

/* ============================== BOOT ============================== */
function boot() {
  const raw = Store.get(LS_KEY);
  let fresh = false;
  if (raw) {
    try { db = migrate(JSON.parse(raw)); }
    catch (e) { console.warn('Corrupt store, starting fresh', e); db = defaultDB(); db.items = seedItems(); fresh = true; }
  } else {
    db = defaultDB();
    db.items = seedItems();
    fresh = true;
  }
  save(true);
  if (!Store.ok) console.warn('localStorage unavailable — running in memory only');
  wireEvents();
  render();
  if (fresh && db.docs.length === 0) {
    setTimeout(() => toast('Welcome to SignFlow — start in Business Settings', 'ok'), 600);
  }
}

boot();
</script>
